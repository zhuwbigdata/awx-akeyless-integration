---
# sync_aws_credential.yml
# Fetches AWS credentials from Akeyless and creates/updates an AWX credential.
# Run as a scheduled AWX job with:
#   - Akeyless custom credential attached (injects AKEYLESS_* env vars)
#   - AAP credential attached (injects CONTROLLER_* env vars)

- name: Sync AWS credentials from Akeyless to AWX
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    akeyless_aws_secret_name: "{{ lookup('env', 'AKEYLESS_AWS_SECRET_NAME') | default('/devops/test-user-password-as-generic', true) }}"
    akeyless_secret_type: "{{ lookup('env', 'AKEYLESS_SECRET_TYPE') | default('static', true) }}"
    aws_credential_name: "{{ lookup('env', 'AWS_CREDENTIAL_NAME') | default('aws-creds-from-akeyless', true) }}"
    aws_credential_organization: "{{ lookup('env', 'AWS_CREDENTIAL_ORG') | default('Default', true) }}"
    # Field mapping: Akeyless response keys -> AWX AWS credential input keys
    aws_access_key_field: "{{ lookup('env', 'AWS_ACCESS_KEY_FIELD') | default('access_key', true) }}"
    aws_secret_key_field: "{{ lookup('env', 'AWS_SECRET_KEY_FIELD') | default('secret_key', true) }}"
    aws_token_field: "{{ lookup('env', 'AWS_TOKEN_FIELD') | default('security_token', true) }}"

  tasks:
    - name: Resolve Akeyless auth parameters from environment
      ansible.builtin.set_fact:
        _ak_api_url: "{{ lookup('env', 'AKEYLESS_API_URL') | default('https://api.akeyless.io', true) }}"
        _ak_access_type: "{{ lookup('env', 'AKEYLESS_ACCESS_TYPE') | default('', true) }}"
        _ak_access_id: "{{ lookup('env', 'AKEYLESS_ACCESS_ID') | default('', true) }}"
        _ak_access_key: "{{ lookup('env', 'AKEYLESS_ACCESS_KEY') | default('', true) }}"
        _ak_cert_file: "{{ lookup('env', 'AKEYLESS_CERT_FILE') | default('', true) }}"
        _ak_key_file: "{{ lookup('env', 'AKEYLESS_KEY_FILE') | default('', true) }}"
        _ak_gateway_url: "{{ lookup('env', 'AKEYLESS_GATEWAY_URL') | default('', true) }}"
        _ak_k8s_config_name: "{{ lookup('env', 'AKEYLESS_K8S_AUTH_CONFIG_NAME') | default('', true) }}"
        _ak_k8s_sa_token: "{{ lookup('env', 'AKEYLESS_K8S_SERVICE_ACCOUNT_TOKEN') | default('', true) }}"

    - name: Resolve cert auth material (read PEM files and base64 encode)
      when: _ak_access_type == 'cert'
      block:
        - name: Read certificate file
          ansible.builtin.slurp:
            src: "{{ _ak_cert_file }}"
          register: _cert_slurp

        - name: Read private key file
          ansible.builtin.slurp:
            src: "{{ _ak_key_file }}"
          register: _key_slurp

        - name: Set cert auth facts
          ansible.builtin.set_fact:
            _ak_cert_data: "{{ _cert_slurp.content }}"
            _ak_key_data: "{{ _key_slurp.content }}"

    - name: Fetch static secret from Akeyless
      when: akeyless_secret_type == 'static'
      akeyless.secrets_management.get_static_secret_value:
        akeyless_api_url: "{{ _ak_api_url }}"
        access_type: "{{ _ak_access_type }}"
        access_id: "{{ _ak_access_id }}"
        access_key: "{{ _ak_access_key if _ak_access_type == 'api_key' else omit }}"
        cert_data: "{{ _ak_cert_data | default(omit) }}"
        key_data: "{{ _ak_key_data | default(omit) }}"
        akeyless_gateway_url: "{{ _ak_gateway_url if _ak_gateway_url else omit }}"
        k8s_auth_config_name: "{{ _ak_k8s_config_name if _ak_k8s_config_name else omit }}"
        k8s_service_account_token: "{{ _ak_k8s_sa_token if _ak_k8s_sa_token else omit }}"
        names:
          - "{{ akeyless_aws_secret_name }}"
      register: _secret_result
      no_log: true

    - name: Fetch dynamic secret from Akeyless
      when: akeyless_secret_type == 'dynamic'
      akeyless.secrets_management.get_dynamic_secret_value:
        akeyless_api_url: "{{ _ak_api_url }}"
        access_type: "{{ _ak_access_type }}"
        access_id: "{{ _ak_access_id }}"
        access_key: "{{ _ak_access_key if _ak_access_type == 'api_key' else omit }}"
        cert_data: "{{ _ak_cert_data | default(omit) }}"
        key_data: "{{ _ak_key_data | default(omit) }}"
        akeyless_gateway_url: "{{ _ak_gateway_url if _ak_gateway_url else omit }}"
        k8s_auth_config_name: "{{ _ak_k8s_config_name if _ak_k8s_config_name else omit }}"
        k8s_service_account_token: "{{ _ak_k8s_sa_token if _ak_k8s_sa_token else omit }}"
        name: "{{ akeyless_aws_secret_name }}"
      register: _dynamic_result
      no_log: true

    - name: Parse secret data for static secret (expect JSON with AWS fields)
      when: akeyless_secret_type == 'static'
      ansible.builtin.set_fact:
        _aws_data: "{{ _secret_result.data[akeyless_aws_secret_name] | from_json }}"

    - name: Use dynamic/rotated secret data directly
      when: akeyless_secret_type != 'static'
      ansible.builtin.set_fact:
        _aws_data: "{{ _dynamic_result.data }}"

    - name: Resolve AWS credential fields from secret data
      ansible.builtin.set_fact:
        _aws_access_key: >-
          {{ _aws_data[aws_access_key_field] | default(
             _aws_data.access_key_id | default(
             _aws_data.access_key | default(
             _aws_data.username | default('')
           ))) }}
        _aws_secret_key: >-
          {{ _aws_data[aws_secret_key_field] | default(
             _aws_data.secret_access_key | default(
             _aws_data.secret_key | default(
             _aws_data.password | default('')
           ))) }}
        _has_session_token: >-
          {{ (_aws_data[aws_token_field] is defined and _aws_data[aws_token_field]) or
             (_aws_data.security_token is defined and _aws_data.security_token) or
             (_aws_data.session_token is defined and _aws_data.session_token) }}
        _aws_session_token: >-
          {{ _aws_data[aws_token_field] | default(
             _aws_data.security_token | default(
             _aws_data.session_token | default('')
           )) }}

    - name: Create or update AWS credential in AWX
      awx.awx.credential:
        name: "{{ aws_credential_name }}"
        organization: "{{ aws_credential_organization }}"
        credential_type: "Amazon Web Services"
        inputs: >-
          {{ {'username': _aws_access_key, 'password': _aws_secret_key}
             | combine({'security_token': _aws_session_token} if _has_session_token else {}) }}
        state: present
        controller_host: "{{ lookup('env', 'CONTROLLER_HOST') }}"
        controller_username: "{{ lookup('env', 'CONTROLLER_USERNAME') }}"
        controller_password: "{{ lookup('env', 'CONTROLLER_PASSWORD') }}"
        validate_certs: false
      register: _cred_result

    - name: Report sync result
      ansible.builtin.debug:
        msg: >-
          AWS credential '{{ aws_credential_name }}' synced successfully
          (changed={{ _cred_result.changed }}, type={{ akeyless_secret_type }}).
          Next runbook using this credential will get the latest values.
